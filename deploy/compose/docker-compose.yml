version: "3.9"

services:
  agent-api:
    # Use GHCR image for releases; uncomment build: section for local development
    image: ghcr.io/h3ow3d/bb-8-agent:${VERSION:-latest}
    # build:
    #   context: ../..
    #   dockerfile: Dockerfile
    container_name: bb8-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SIDECAR_API_TOKEN: ${SIDECAR_API_TOKEN:-change-me}
      KUBECONFIG: /kube/config
      K8S_CONTEXT: ${K8S_CONTEXT:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      AUDIT_DB_PATH: /data/audit/bb-8.db
      KNOWLEDGE_DIR: /knowledge
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${KUBECONFIG_PATH:-~/.kube/config}:/kube/config:ro
      - ../../knowledge:/knowledge:ro
      - audit_data:/data/audit
    depends_on:
      - ollama
    networks:
      - bb8-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: bb8-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - bb8-net
    # GPU support — requires NVIDIA Container Toolkit on host
    # Remove 'deploy' section if running without GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
    driver: local
  audit_data:
    driver: local

networks:
  bb8-net:
    driver: bridge
