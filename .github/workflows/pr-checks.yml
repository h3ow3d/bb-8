name: PR Checks

on:
  pull_request:
  push:
    branches-ignore:
      - "refs/tags/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Type-check, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type check
        run: mypy app tests

      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Bandit security scan
        run: bandit -r app/ -c pyproject.toml

      - name: pip-audit
        run: pip-audit --require-hashes --no-deps -r <(pip freeze | grep -v "^-e") || pip-audit

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bb8-agent:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bb8-agent:ci
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Validate Docker Compose config
        run: |
          docker compose -f deploy/compose/docker-compose.yml config

  smoke-test:
    name: Smoke Test (no live cluster)
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start agent-api in test mode (no k8s, no ollama)
        env:
          SIDECAR_API_TOKEN: ci-test-token
          KUBECONFIG: /tmp/nonexistent
          OLLAMA_BASE_URL: http://localhost:19999
          AUDIT_DB_PATH: /tmp/ci-audit.db
          KNOWLEDGE_DIR: /tmp/knowledge
          LOG_LEVEL: WARNING
        run: |
          mkdir -p /tmp/knowledge
          uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          sleep 3
          echo "Server started"

      - name: Test /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health)
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Test 401 without token
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v1/audit/recent)
          echo "No-token status: $STATUS"
          [ "$STATUS" = "401" ] || exit 1

      - name: Test 401 with wrong token
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer invalid-wrong-token" http://127.0.0.1:8080/v1/audit/recent)
          echo "Wrong-token status: $STATUS"
          [ "$STATUS" = "401" ] || exit 1

      - name: Test 200 audit/recent with correct token
        env:
          SIDECAR_API_TOKEN: ci-test-token
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $SIDECAR_API_TOKEN" http://127.0.0.1:8080/v1/audit/recent)
          echo "Correct-token status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Test cluster review returns 503 (no k8s)
        env:
          SIDECAR_API_TOKEN: ci-test-token
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $SIDECAR_API_TOKEN" http://127.0.0.1:8080/v1/cluster/review)
          echo "Cluster review status: $STATUS"
          [ "$STATUS" = "503" ] || [ "$STATUS" = "200" ] || exit 1
